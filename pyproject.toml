[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-nutricionistas"
version = "1.0.0"
description = "Sistema profissional para atendimento, avaliação e acompanhamento nutricional."
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
nutri-app = "nutri_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".test_cache"

[tool.coverage.run]
source = ["nutri_app"]
branch = true

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = true
